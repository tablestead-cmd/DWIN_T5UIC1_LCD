name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the package versions shipped by Debian 13
        run: pip install pyserial==3.5 gpiozero==2.0.1
      - name: Unit tests (mock display + mock Moonraker, no hardware)
        run: python -m unittest discover -s tests -v
      - name: Shell scripts
        run: shellcheck install.sh uninstall.sh
